name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      pi_version:
        description: "Upstream pi version (npm dist-tag or x.y.z)"
        default: "latest"
        required: false

env:
  # Pin reproducibly per-run with `PI_VERSION=1.3.0 gh act` or dispatch input.
  PI_VERSION: ${{ inputs.pi_version || 'latest' }}
  REGISTRY_IMAGE: ghcr.io/heretek-ai/oh-mine-pi

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: |
          docker compose config --quiet
          printf 'OPENCODE_GO_API_KEY=dummy\nSEARXNG_BASE_URL=http://127.0.0.1:8888\nFIRECRAWL_BASE_URL=http://127.0.0.1:3002\nCRAWL4AI_BASE_URL=http://127.0.0.1:11235\nCRAWL4AI_API_TOKEN=dummy\n' > swarm/.env
          docker compose -f swarm/docker-compose.swarm.yml config --quiet
          rm swarm/.env

      - uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pi-smoke:latest
          build-args: PI_VERSION=${{ env.PI_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm pi-smoke:latest pi --version
          test "$(docker run --rm pi-smoke:latest whoami)" = "pi"
          docker run --rm -v pi-home-smoke:/home/pi pi-smoke:latest pi --version
          docker volume rm pi-home-smoke

      - name: Build swarm role image
        uses: docker/build-push-action@v6
        with:
          context: ./swarm/images/pi-swarm
          platforms: linux/amd64
          load: true
          tags: swarm-smoke:latest
          build-args: |
            BASE_IMAGE=pi-smoke:latest
            PI_VERSION=${{ env.PI_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test swarm image
        run: |
          set -euo pipefail
          docker run --rm -e PI_EXTENSIONS= swarm-smoke:latest pi --version
          test "$(docker run --rm -e PI_EXTENSIONS= swarm-smoke:latest whoami)" = "pi"
          docker run --rm --entrypoint ls swarm-smoke:latest /etc/pi-swarm/mcp /etc/pi-swarm/research

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          # Lightweight: amd64 only. Add linux/arm64 once you need it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PI_VERSION=${{ env.PI_VERSION }}
          cache-from: type=gha
